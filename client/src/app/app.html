<header class="app-header">
  <h1><a routerLink="/students">{{ title() }}</a></h1>
</header>

<!-- פס טעינה גלובלי: מוצג כל עוד יש בקשת HTTP פעילה (מתעדכן ע"י ה-interceptor) -->
@if (loading.isLoading()) {
  <div class="progress-bar"></div>
}

<main class="app-content">
  <!-- כאן ה-Router יציג את הקומפוננטה של הדף הנוכחי (בדומה ל-Frame ב-WPF) -->
  <router-outlet />
</main>
